<!-- ============================================================
     CODEX — Página: Início (Home)
     Menu orbital + dado central + título + rodapé.
     O rodapé é injetado pelo script.js (componente reutilizável).
     ============================================================ -->

<main id="pagina-inicio" class="screen">

    <!-- Título CodeX (botão home) — injetado pelo script.js -->
    <!-- <a class="codex-title" ...>CodeX</a> -->

    <div class="menu-wrapper">
        <div class="menu-orbit" id="menu-orbit">
            <div class="orbit-ring outer"></div>
            <div class="orbit-ring inner"></div>

            <!-- Dado central: abre login/perfil -->
            <a href="#" class="center-dice" id="center-dice-btn" role="button" title="Conta / Perfil">
                <i class="fas fa-dice-d20"></i>
            </a>

            <div class="orbit-icons-rotator">
                <a href="#" class="orbit-item" data-rota="/ficha"        data-section="ficha"><i class="fas fa-id-card"></i></a>
                <a href="#" class="orbit-item" data-rota="/materiais"    data-section="materiais"><i class="fas fa-cubes"></i></a>
                <a href="#" class="orbit-item" data-rota="/itens"        data-section="itens"><i class="fas fa-bag-shopping"></i></a>
                <a href="#" class="orbit-item" data-rota="/equipamentos" data-section="equipamento"><i class="fas fa-shield-alt"></i></a>
                <a href="#" class="orbit-item" data-rota="/deuses"       data-section="deuses"><i class="fas fa-dharmachakra"></i></a>
                <a href="#" class="orbit-item" data-rota="/magias"       data-section="magias"><i class="fas fa-hat-wizard"></i></a>
                <a href="#" class="orbit-item" data-rota="/bestiario"    data-section="bestiario"><i class="fas fa-dragon"></i></a>
            </div>
        </div>

        <!-- Painel: autenticação (login/registro) -->
        <div class="screen-panel" id="auth-panel">
            <div class="section-icon"><i class="fas fa-user-shield"></i></div>
            <h2 class="section-title-text">Acesso</h2>
            <p class="section-desc">Entre ou crie sua conta para salvar seu progresso.</p>

            <div class="auth-container">
                <div class="auth-tabs">
                    <div class="auth-tab active" id="tab-login" role="button">Entrar</div>
                    <div class="auth-tab" id="tab-register" role="button">Registrar</div>
                </div>

                <form class="auth-form active" id="form-login">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" class="auth-input" id="login-email" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="auth-input" id="login-password" placeholder="Senha" required>
                    </div>
                    <button type="submit" class="btn-primary">Entrar</button>
                </form>

                <form class="auth-form" id="form-register">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" class="auth-input" id="reg-name" placeholder="Nome de Aventureiro" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" class="auth-input" id="reg-email" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="auth-input" id="reg-password" placeholder="Senha" required>
                    </div>
                    <button type="submit" class="btn-primary">Criar Conta</button>
                </form>
            </div>
        </div>

        <!-- Painel: perfil -->
        <div class="screen-panel" id="profile-panel">
            <div class="profile-avatar">
                <i class="fas fa-hat-wizard"></i>
            </div>
            <h2 class="section-title-text" id="profile-name">Aventureiro</h2>
            <p class="section-desc">Bem-vindo de volta ao Codex. Sua jornada continua.</p>
            <button class="btn-secondary" id="btn-logout">Sair da Conta</button>
        </div>
    </div>

    <!-- Rodapé — injetado pelo script.js -->
    <!-- <div class="footer-terms" id="footer-terms">...</div> -->

</main>
