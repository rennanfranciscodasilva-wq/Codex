<main id="pagina-confirmar-email" class="screen">
    <section class="confirmacao-email" aria-labelledby="titulo-confirmar-email">
        <h1 id="titulo-confirmar-email">Confirme seu e-mail</h1>
        <p class="confirmacao-endereco"></p>
        <p class="confirmacao-status" role="status">Carregando sua conta…</p>
        <div class="confirmacao-acoes" hidden>
            <button type="button" class="btn-primary confirmacao-reenviar">Reenviar e-mail</button>
            <button type="button" class="btn-primary confirmacao-consultar">Já confirmei meu e-mail</button>
        </div>
        <a class="confirmacao-continuar" href="#/perfil">Continuar para o perfil</a>
    </section>
</main>
