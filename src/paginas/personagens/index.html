<main id="pagina-personagens" class="screen">
    <div class="personagens-container">
        <header class="cabecalho-personagens">
            <button id="btn-voltar-sistemas" class="btn-voltar">
                <i class="fas fa-arrow-left"></i> Voltar aos Sistemas
            </button>
            
            <div class="info-sistema-topo">
                <h1>Personagens</h1>
                <div class="sistema-personagens-linha">
                    <h2 id="titulo-sistema-personagens"></h2>
                    <button type="button" class="btn-editar-detalhe" id="btn-editar-titulo-sistema" title="Editar título do sistema" aria-label="Editar título do sistema">
                        <i class="fas fa-pen" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="sistema-personagens-linha">
                    <p id="descricao-sistema-personagens"></p>
                    <button type="button" class="btn-editar-detalhe" id="btn-editar-descricao-sistema" title="Editar descrição do sistema" aria-label="Editar descrição do sistema">
                        <i class="fas fa-pen" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <button id="btn-novo-personagem" class="btn-criar-personagem">
                <i class="fas fa-plus"></i> Criar Novo Personagem
            </button>
        </header>

        <div id="lista-personagens-container" class="lista-personagens">
            <!-- Os cards dos personagens serão inseridos aqui via JS -->
        </div>
    </div>
</main>
