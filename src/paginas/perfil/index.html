<main id="pagina-perfil" class="screen" aria-labelledby="profile-name">
    <div class="perfil-conteudo-wrapper">
        <header class="perfil-user-header">
            <button type="button" class="perfil-avatar-container" id="btn-editar-avatar" aria-label="Editar foto de perfil">
                <span class="perfil-avatar">
                    <i class="fas fa-hat-wizard" id="avatar-icon-padrao" aria-hidden="true"></i>
                    <img id="avatar-imagem" alt="" hidden>
                </span>
                <span class="perfil-avatar-edit-icon" aria-hidden="true"><i class="fas fa-pen"></i></span>
            </button>
            <div class="perfil-identidade">
                <div class="perfil-nome-wrapper">
                    <h1 class="perfil-nome" id="profile-name">Perfil</h1>
                    <button type="button" class="btn-editar-perfil" id="btn-editar-perfil" aria-label="Editar nome" title="Editar nome">
                        <i class="fas fa-pen" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="perfil-email-wrapper">
                    <p class="perfil-email" id="profile-email"></p>
                    <button type="button" class="btn-toggle-visibilidade" id="btn-toggle-email" aria-label="Ocultar e-mail">
                        <i class="fas fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </header>

        <nav class="perfil-nav" aria-label="Seções do perfil">
            <button type="button" class="perfil-nav-item" data-tab="fichas" aria-controls="tab-content-fichas" aria-pressed="true"><i class="fas fa-scroll" aria-hidden="true"></i> Fichas</button>
            <button type="button" class="perfil-nav-item" data-tab="biblioteca" aria-controls="tab-content-biblioteca" aria-pressed="false"><i class="fas fa-book-open" aria-hidden="true"></i> Biblioteca</button>
            <button type="button" class="perfil-nav-item" data-tab="config" aria-controls="tab-content-config" aria-pressed="false"><i class="fas fa-cog" aria-hidden="true"></i> Conta</button>
        </nav>

        <div class="perfil-content">
            <section class="perfil-tab-content" id="tab-content-fichas" aria-labelledby="perfil-titulo-fichas">
                <h2 class="perfil-page-title" id="perfil-titulo-fichas">Minhas fichas</h2>
                <div id="perfil-fichas-categorias"></div>
            </section>

            <section class="perfil-tab-content" id="tab-content-biblioteca" aria-labelledby="perfil-titulo-biblioteca" hidden>
                <h2 class="perfil-page-title" id="perfil-titulo-biblioteca">Minha biblioteca</h2>
                <p class="perfil-estado">Seus itens, magias e bestiário salvos aparecerão aqui.</p>
            </section>

            <section class="perfil-tab-content" id="tab-content-config" aria-labelledby="perfil-titulo-conta" hidden>
                <h2 class="perfil-page-title" id="perfil-titulo-conta">Configurações da conta</h2>
                <div class="config-box">
                    <h3>Informações pessoais</h3>
                    <label class="config-item">Número de telefone
                        <input type="tel" class="config-input" placeholder="(11) 99999-9999">
                    </label>
                    <label class="config-item">Endereço de e-mail
                        <input type="email" class="config-input" id="config-email-input" disabled>
                    </label>
                </div>
                <div class="config-box danger-zone">
                    <h3>Zona de perigo</h3>
                    <p>Uma vez excluída, sua conta não poderá ser recuperada. Todos os dados serão apagados permanentemente.</p>
                    <button type="button" class="btn-danger" id="btn-excluir-conta">Excluir conta</button>
                </div>
            </section>
        </div>

        <footer class="perfil-rodape">
            <button type="button" class="btn-secondary perfil-btn-logout" id="btn-logout">
                <i class="fas fa-door-open" aria-hidden="true"></i> Sair da conta
            </button>
        </footer>
    </div>

    <template id="modal-avatar">
        <div class="codex-dialogo-campos perfil-dialogo-avatar">
            <label>URL da imagem
                <input name="imagem" inputmode="url" placeholder="https://exemplo.com/imagem.png" autofocus>
            </label>
            <div class="preview-circle">
                <img alt="Prévia da foto de perfil" hidden>
                <i class="fas fa-hat-wizard" aria-hidden="true"></i>
            </div>
            <label>Zoom <input name="zoom" type="range" min="0.5" max="2" step="0.1" value="1"></label>
            <label>Posição horizontal <input name="x" type="range" min="-50" max="50" value="0"></label>
            <label>Posição vertical <input name="y" type="range" min="-50" max="50" value="0"></label>
            <p class="codex-dialogo-erro" role="alert" hidden></p>
        </div>
    </template>
    <template id="modal-nome">
        <div class="codex-dialogo-campos">
            <label>Novo nome <input name="nome" autofocus></label>
            <p class="codex-dialogo-erro" role="alert" hidden></p>
        </div>
    </template>
</main>
